<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield Silhouette -->
  <path d="M32 4 L56 14 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V14 Z" fill="#080C16" stroke="url(#shieldGrad)" stroke-width="2.5" />
  
  <!-- Inner Circuit Grid Accent -->
  <path d="M32 12 L48 20 V30 C48 40 40 48 32 52 C24 48 16 40 16 30 V20 Z" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Central Glowing Security Core / Diamond Lock -->
  <polygon points="32,22 42,32 32,42 22,32" fill="url(#coreGrad)" filter="url(#glow)"/>
  
  <!-- Core Inner Anchor -->
  <circle cx="32" cy="32" r="3.5" fill="#080C16" />
  <circle cx="32" cy="32" r="1.5" fill="#00E5FF" />
</svg>
