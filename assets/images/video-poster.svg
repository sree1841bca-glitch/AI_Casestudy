<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f2240"/>
      <stop offset="50%" stop-color="#09101c"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 229, 255, 0.8)"/>
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="1280" height="720" fill="url(#bgGlow)"/>
  <rect width="1280" height="720" fill="url(#gridPattern)"/>

  <!-- Perspective Cyber Grid at the Bottom -->
  <g opacity="0.4">
    <line x1="0" y1="520" x2="1280" y2="520" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
    <line x1="0" y1="610" x2="1280" y2="610" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5"/>
    <line x1="0" y1="670" x2="1280" y2="670" stroke="rgba(0, 229, 255, 0.6)" stroke-width="2"/>
    
    <!-- Perspective Rays -->
    <line x1="640" y1="480" x2="0" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <line x1="640" y1="480" x2="240" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <line x1="640" y1="480" x2="480" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <line x1="640" y1="480" x2="800" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <line x1="640" y1="480" x2="1040" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <line x1="640" y1="480" x2="1280" y2="720" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
  </g>

  <!-- Ambient Horizontal Glow Bar -->
  <rect x="140" y="360" width="1000" height="2" fill="url(#cyanLine)" filter="url(#neonGlow)"/>

  <!-- Concentric Orbital Cyber Rings -->
  <circle cx="640" cy="330" r="160" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" stroke-dasharray="8 6"/>
  <circle cx="640" cy="330" r="190" fill="none" stroke="rgba(0, 163, 255, 0.12)" stroke-width="1" stroke-dasharray="14 10"/>
  <circle cx="640" cy="330" r="230" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1"/>

  <!-- Central Shield Silhouette -->
  <g transform="translate(640, 310) scale(1.6)">
    <path d="M0 -70 L55 -45 V-5 C55 35 30 65 0 75 C-30 65 -55 35 -55 -5 V-45 Z" 
          fill="rgba(10, 22, 40, 0.85)" 
          stroke="url(#shieldGrad)" 
          stroke-width="3"
          filter="url(#neonGlow)"/>
    
    <!-- Inner Lock / Core Diamond -->
    <polygon points="0,-25 22,0 0,25 -22,0" fill="#00E5FF" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#080C16"/>
    <circle cx="0" cy="0" r="2.5" fill="#00E5FF"/>
  </g>

  <!-- Left HUD Telemetry Box -->
  <g transform="translate(140, 240)">
    <rect width="220" height="130" rx="8" fill="rgba(13, 21, 38, 0.75)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#00E5FF" letter-spacing="1">DEFENSE PERIMETER</text>
    <text x="18" y="56" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Policy: Zero Trust</text>
    <text x="18" y="78" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#94A3B8">STATUS: <tspan fill="#10B981">ENFORCED</tspan></text>
    <rect x="18" y="94" width="184" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="94" width="160" height="6" rx="3" fill="#00E5FF"/>
  </g>

  <!-- Right HUD Telemetry Box -->
  <g transform="translate(920, 240)">
    <rect width="220" height="130" rx="8" fill="rgba(13, 21, 38, 0.75)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#00E5FF" letter-spacing="1">ENCRYPTION ENGINE</text>
    <text x="18" y="56" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">TLS 1.3 / AES-256</text>
    <text x="18" y="78" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#94A3B8">HANDSHAKE: <tspan fill="#10B981">VALIDATED</tspan></text>
    <rect x="18" y="94" width="184" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="94" width="184" height="6" rx="3" fill="#10B981"/>
  </g>

  <!-- Top Title / Brand Header in Poster -->
  <g transform="translate(640, 110)" text-anchor="middle">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#00E5FF" letter-spacing="4">SENTINELCORE TECHNOLOGIES</text>
    <text y="42" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">CYBERSECURITY &amp; IT SOLUTIONS BRIEFING</text>
    <text y="70" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8">Practical Security Strategies For Modern Enterprises</text>
  </g>

  <!-- Centered Play Icon Watermark (Subtle) -->
  <circle cx="640" cy="330" r="44" fill="rgba(0, 229, 255, 0.15)" stroke="#00E5FF" stroke-width="2" filter="url(#neonGlow)"/>
  <polygon points="634,316 654,330 634,344" fill="#FFFFFF"/>

  <!-- Bottom Ticker Bar -->
  <rect x="0" y="680" width="1280" height="40" fill="rgba(7, 12, 20, 0.95)" stroke-top="rgba(255, 255, 255, 0.08)"/>
  <text x="30" y="705" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">
    <tspan fill="#00E5FF">PROMO VIDEO PREVIEW</tspan> // AUDIO: 48kHz STEREO // CODEC: H.264 // SENTINELCORE OVERVIEW
  </text>
  <text x="1250" y="705" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10B981" text-anchor="end">
    ● READY FOR ASSET REPLACEMENT
  </text>
</svg>
